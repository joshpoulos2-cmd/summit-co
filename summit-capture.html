// Build full URLs
const ALL_SLUGS = [
  ...REAL_SLUGS.map(s => `https://www.alltrails.com/trail/us/colorado/${s}`),
  ...AT_SLUGS.map(s => `https://www.alltrails.com/api/alltrails/v2/trails/details/${s.replace('at-','')}`)
];

let running = false;
let idx = parseInt(localStorage.getItem('_captureIdx') || '0');
let captured = parseInt(localStorage.getItem('_captureOk') || '0');

function log(msg) {
  const el = document.getElementById('log');
  el.textContent = msg + '\n' + el.textContent;
}

function updateUI() {
  const pct = (idx / ALL_SLUGS.length * 100).toFixed(1);
  document.getElementById('bar').style.width = pct + '%';
  document.getElementById('status').textContent =
    `Trail ${idx}/${ALL_SLUGS.length} (${pct}%) | Captured: ${captured}`;
}

function stopCapture() {
  running = false;
  log('Stopped.');
}

function skipOne() {
  idx++;
  localStorage.setItem('_captureIdx', idx);
  updateUI();
  if (running) loadNext();
}

async function startCapture() {
  running = true;
  log(`Starting from trail ${idx}...`);
  loadNext();
}

function loadNext() {
  if (!running || idx >= ALL_SLUGS.length) {
    log('DONE! All trails processed.');
    running = false;
    return;
  }

  updateUI();
  const url = ALL_SLUGS[idx];
  const isApi = url.includes('/api/');

  if (isApi) {
    // For API URLs, the iframe load through the proxy will capture the response
    log(`[${idx}] API: ${url.split('/').pop()}`);
  } else {
    log(`[${idx}] Page: ${url.split('/').pop()}`);
  }

  const frame = document.getElementById('frame');
  frame.src = url;

  // Wait for load, then advance
  setTimeout(() => {
    captured++;
    localStorage.setItem('_captureOk', captured);
    idx++;
    localStorage.setItem('_captureIdx', idx);
    if (running) loadNext();
  }, isApi ? 3000 : 8000); // API calls are fast, pages need time to load map
}

updateUI();
</script>
